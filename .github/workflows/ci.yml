name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::230355213948:role/zero-downtime-deployment-github-actions"
          aws-region: "us-east-1"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Test application
        run: |
          python -m py_compile app/app.py
          echo "Application syntax check passed"

      - name: Build Docker image
        run: docker build -t zero-downtime-app -f app/Dockerfile .

      - name: Deploy to AWS App 1
        env:
          VERSION: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00ac64af94e4afeb6 \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['cd /home/ec2-user/zero-downtime-deployment && git -c safe.directory=/home/ec2-user/zero-downtime-deployment pull origin main && sed -i \"s/\r$//\" deploy-aws.sh && chmod +x deploy-aws.sh && CONTAINER_NAME=app1 SERVER=aws-app1 VERSION=${VERSION:0:7} ./deploy-aws.sh']" \
            --query "Command.CommandId" \
            --output text)

          echo "App 1 Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-00ac64af94e4afeb6

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00ac64af94e4afeb6

      - name: Check App 1 ALB health
        run: |
          for i in {1..20}; do
            HEALTH=$(aws elbv2 describe-target-health \
              --target-group-arn "arn:aws:elasticloadbalancing:us-east-1:230355213948:targetgroup/zero-downtime-tg/c365f46e7f025c58" \
              --targets Id=i-00ac64af94e4afeb6 \
              --query "TargetHealthDescriptions[0].TargetHealth.State" \
              --output text)

            echo "App 1 ALB health: $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then
              echo "App 1 is healthy."
              exit 0
            fi

            sleep 10
          done

          echo "App 1 failed ALB health check."
          exit 1
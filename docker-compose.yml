services:
  app1:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app1
    environment:
      VERSION: "3.0"
      SERVER: "server-1"
    ports:
      - "5000:5000"

  app2:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app2
    environment:
      VERSION: "3.0"
      SERVER: "server-2"
    ports:
      - "5001:5000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
